  <ul class="menu" id="menu">

<script>
  // Fonction quitter
  function quitterSite() {
    window.open('', '_self');
    window.close();
  }

  // Hamburger menu
  document.getElementById("hamburger").addEventListener("click", function() {
    document.getElementById("menu").classList.toggle("active");
  });

  // Service Worker pour PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
    .then(() => console.log('Service Worker enregistré.'))
    .catch(err => console.log('Erreur Service Worker :', err));
  }
</script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const btn = document.getElementById("btnAdmin");
  if(btn) {
    btn.addEventListener("click", function () {
      setTimeout(function(){ // small timeout pour éviter les blocages sur mobile
        const login = prompt("Login administrateur :");
        const mdp = prompt("Mot de passe :");

        if (login === "admin" && mdp === "FSGF2026") {
          window.location.href = "https://sghfsgf.github.io/Admin-Planification/"; // ouvrir dans le même onglet
        } else {
          alert("Accès refusé");
        }
      }, 10);
    });
  }
});
</script>
