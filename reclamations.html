<header>
  <h1>Reclamations</h1>
</header>

<section class="form-section">
  <h2>Formulaire de Réclamation</h2>

  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <form
    method="POST"
    action="https://script.google.com/macros/s/AKfycbzmZuz32NssQ3khol_r0nnpFeDYeTMbJwqJemW0oJL4Z93QgWE-CA7d_OfeU6s3fhNN/exec"
    target="hidden_iframe"
  >
    <label>Département *</label>
    <select name="department" required>
      <option disabled selected value="">Choisir...</option>
      <option value="SV">SV</option>
      <option value="ST">ST</option>
      <option value="INFO">INFO</option>
      <option value="CH">CH</option>
      <option value="PHYS">PHYS</option>
      <option value="FT">FT</option>
      <option value="MATHS">MATHS</option>
      <option value="LANGUES">LANGUES</option>
    </select>

    <label>Nom de l'enseignant *</label>
    <input type="text" name="nomEnseignant" required>

    <label>Adresse e-mail *</label>
    <input type="email" name="email" required>

    <label>Type de Réclamation *</label>
    <select name="typeReclamation" required>
      <option disabled selected value="">Choisir...</option>
      <option value="Demande pour le vice-doyen de la FSGF">Demande pour le vice-doyen de la FSGF</option>
      <option value="Changer une matière dans le calendrier">Changer une matière dans le calendrier</option>
      <option value="Permuter des matières">Permuter des matières</option>
      <option value="Être absent pendant les jours des surveillances">Être absent pendant les jours des surveillances</option>
      <option value="Avoir une information">Avoir une information</option>
      <option value="Autre type de Réclamation">Autre type de Réclamation</option>
    </select>

    <label>Détails (facultatif)</label>
    <textarea name="details" rows="4"></textarea>

    <button type="submit" style="display:inline-block; padding:6px 12px; width:auto; text-align:center;">
      Envoyer
    </button>
  </form>

  <div id="message"></div>

  <script>
    document.getElementsByName("hidden_iframe")[0].addEventListener("load", function() {
      const msg = document.getElementById("message");
      msg.textContent = "✅ Réclamation envoyée avec succès !";
      msg.style.color = "green";
      document.querySelector("form").reset();
      setTimeout(() => msg.textContent = "", 2000);
    });
  </script>
</section>


<footer>
  <p>Site officiel : <a href="https://fsgf.rnu.tn/" target="_blank">https://fsgf.rnu.tn/</a></p>

  document.getElementById("hamburger").addEventListener("click", function() {

</script>
